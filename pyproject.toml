[project]
name = "flowviper"
version = "0.0.1"
description = "Prefect workflow examples for radio astronomy data processing with astroviper"
authors = [
    { name = "Jan-Willem Steeb", email = "jsteeb@nrao.edu" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">= 3.11, < 3.15"

dependencies = [
    "astroviper[all]>=0.0.39",
    "prefect>=3.8.2",
]

[project.optional-dependencies]
interactive = [
    "jupyterlab",
    "ipykernel",
    "ipython",
]

[project.urls]
Documentation = "https://github.com/casangi/flowviper"
Installation = "https://github.com/casangi/flowviper#installation"

[tool.setuptools]
packages = ["flowviper", "flowviper.prefect_workflow"]

[tool.setuptools.package-dir]
"flowviper" = "."
"flowviper.prefect_workflow" = "prefect_workflow"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Same rule set as the other VIPER packages (toolviper, xradio, graphviper,
# astroviper):
#   E4/E7/E9 -- pycodestyle errors (import placement, statement syntax, runtime)
#   F        -- pyflakes: undefined names, unused imports, unused variables
#   B        -- flake8-bugbear: likely bugs (mutable defaults, loop captures, ...)
#   UP       -- pyupgrade: outdated syntax/typing
#   I        -- isort-compatible import sorting
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
